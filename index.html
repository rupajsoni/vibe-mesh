<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Mesh — Find your vibe</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212; --surface: #181818; --surface2: #222; --surface3: #2a2a2a;
  --green: #1DB954; --text: #fff; --muted: #a0a0a0; --faint: #535353; --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'Figtree', sans-serif; font-size: 14px; }

.shell { display: flex; height: 100vh; }

/* Sidebar */
.sidebar { width: 196px; flex-shrink: 0; background: #000; display: flex; flex-direction: column; padding: 18px 0 14px; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 9px; padding: 0 14px 22px; }
.logo-mark { width: 26px; height: 26px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #000; flex-shrink: 0; }
.logo-text { font-size: 14px; font-weight: 700; }
.nav { padding: 0 7px; display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 5px; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.nav-item:hover, .nav-item.active { color: var(--text); background: var(--surface2); }
.nav-section { padding: 18px 14px 5px; font-size: 10px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; }
.sidebar-bottom { margin-top: auto; padding: 14px; border-top: 1px solid #1a1a1a; }
.tagline-sidebar { font-size: 10px; color: var(--faint); font-style: italic; line-height: 1.5; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Topbar */
.topbar { padding: 14px 20px 10px; flex-shrink: 0; }
.topbar-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.topbar-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.topbar-title span { color: var(--green); }
.topbar-sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.presets-row { display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
.presets-row::-webkit-scrollbar { display: none; }
.preset-chip { font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 14px; background: var(--surface2); color: var(--muted); border: 1px solid var(--surface3); cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
.preset-chip:hover { color: var(--text); border-color: var(--faint); }
.preset-chip.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 700; }

/* Three panes — resizable */
.panes { flex: 1; display: flex; flex-direction: row; gap: 0; padding: 0 20px 16px; overflow: hidden; min-height: 0; }
.drag-handle { width: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: col-resize; position: relative; z-index: 10; }
.drag-handle::after { content: ''; display: block; width: 2px; height: 32px; background: var(--surface3); border-radius: 2px; transition: background 0.15s; }
.drag-handle:hover::after { background: var(--faint); }
.drag-handle.dragging::after { background: var(--green); }

/* Radar */
.radar-pane { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 140px; margin-right: 0; flex-shrink: 0; overflow: hidden; }
.pane-label { font-size: 10px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; flex-shrink: 0; }
.radar-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
#radar circle { cursor: grab; } #radar circle:active { cursor: grabbing; }

/* Sliders */
.sliders-pane { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; min-width: 180px; flex-shrink: 0; }
.sliders-inner { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; overflow: hidden; }
.slider-row { display: flex; flex-direction: column; gap: 1px; }
.slider-top { display: flex; justify-content: space-between; align-items: center; }
.slider-name-wrap { display: flex; align-items: center; gap: 5px; }
.axis-icon { font-size: 12px; }
.slider-name { font-size: 12px; font-weight: 600; }
.slider-val { font-size: 11px; font-weight: 700; color: var(--green); }
.slider-ends { display: flex; justify-content: space-between; }
.slider-end { font-size: 9px; color: var(--faint); }
input[type=range] { width: 100%; height: 3px; accent-color: var(--green); cursor: pointer; margin: 2px 0; }

/* Discover */
.discover-row { flex-shrink: 0; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--surface2); }
.discover-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.discover-label { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.discover-badge { font-size: 8px; font-weight: 700; background: var(--green); color: #000; padding: 1px 5px; border-radius: 8px; text-transform: uppercase; }
.discover-val { font-size: 11px; font-weight: 700; color: var(--green); }
.discover-sub { font-size: 10px; color: var(--faint); margin-bottom: 2px; }
.discover-effect { font-size: 10px; color: var(--green); min-height: 13px; }
input.disc { accent-color: var(--green); width: 100%; height: 3px; margin: 2px 0; }

/* Results */
.results-pane { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; min-width: 160px; flex-shrink: 0; }
.results-inner { flex: 1; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.song-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 5px; transition: background 0.12s; cursor: default; flex-shrink: 0; }
.song-row:hover { background: var(--surface2); }
.song-idx { font-size: 12px; color: var(--faint); width: 14px; text-align: center; flex-shrink: 0; }
.song-art { width: 36px; height: 36px; border-radius: 4px; flex-shrink: 0; }
.song-info { flex: 1; min-width: 0; }
.song-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.song-artist { font-size: 11px; color: var(--muted); }
.song-pct { font-size: 11px; font-weight: 700; color: var(--green); flex-shrink: 0; }
.more-btn { flex-shrink: 0; margin-top: 6px; padding: 7px; background: transparent; border: 1px solid var(--surface3); border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--faint); cursor: not-allowed; opacity: 0.45; }
.results-note { flex-shrink: 0; font-size: 9px; color: var(--faint); font-style: italic; text-align: center; margin-top: 4px; }

@media (max-width: 900px) {
  .sidebar { display: none; }
  html, body { overflow: auto; }
  .panes { grid-template-columns: 1fr; height: auto; overflow: visible; }
  .radar-pane, .sliders-pane, .results-pane { height: auto; }
}
</style>
</head>

<script>
const axes=['Energy','Groove','Fidelity','Vocals','Emotion','Social'];
const icons=['⚡','🎵','📻','🎤','🌗','👥'];
const mins=['Weightless','Static','Hi-fi','Instrumental','Dark','Solitary'];
const maxs=["Full rage","Can't stop","Lo-fi","Raw","Euphoric","Communal"];
const cx=100,cy=100,maxR=68;
const angles=[-90,-30,30,90,150,210].map(d=>d*Math.PI/180);
let vals=[0.7,0.6,0.3,0.5,0.75,0.5];

function pt(i,v){const r=v*maxR;return[cx+r*Math.cos(angles[i]),cy+r*Math.sin(angles[i])];}
function draw(){
  const pts=vals.map((v,i)=>pt(i,v));
  document.getElementById('dp').setAttribute('points',pts.map(p=>p.join(',')).join(' '));
  pts.forEach((p,i)=>{const d=document.getElementById('d'+i);d.setAttribute('cx',p[0]);d.setAttribute('cy',p[1]);});
}

const sw=document.getElementById('sliders');
axes.forEach((n,i)=>{
  const r=document.createElement('div');r.className='slider-row';
  r.innerHTML=`<div class="slider-top"><div class="slider-name-wrap"><span class="axis-icon">${icons[i]}</span><span class="slider-name">${n}</span></div><span class="slider-val" id="sv${i}">${vals[i].toFixed(2)}</span></div><input type="range" min="0" max="100" value="${Math.round(vals[i]*100)}" id="sl${i}"><div class="slider-ends"><span class="slider-end">${mins[i]}</span><span class="slider-end">${maxs[i]}</span></div>`;
  sw.appendChild(r);
  document.getElementById('sl'+i).addEventListener('input',e=>{
    vals[i]=e.target.value/100;document.getElementById('sv'+i).textContent=vals[i].toFixed(2);
    draw();renderSongs();document.querySelectorAll('.preset-chip,.mood-nav-item').forEach(b=>b.classList.remove('active'));
  });
});

  {name:'Lost in it',icon:'🎧',v:[0.50,0.30,0.50,0.55,0.45,0.10]},
];

function loadMood(v,name){
  v.forEach((val,i)=>{vals[i]=val;const sl=document.getElementById('sl'+i);if(sl){sl.value=Math.round(val*100);document.getElementById('sv'+i).textContent=val.toFixed(2);}});
  draw();renderSongs();
  document.querySelectorAll('.preset-chip,.mood-nav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll(`[data-mood="${name}"]`).forEach(b=>b.classList.add('active'));
}

const pc=document.getElementById('presetChips');
moods.forEach(m=>{
  const c=document.createElement('button');c.className='preset-chip';c.textContent=m.icon+' '+m.name;c.dataset.mood=m.name;
  c.addEventListener('click',()=>loadMood(m.v,m.name));pc.appendChild(c);
});

const mn=document.getElementById('moodNav');
moods.forEach(m=>{
  const item=document.createElement('div');item.className='nav-item mood-nav-item';item.dataset.mood=m.name;
  item.innerHTML=`<span>${m.icon}</span>${m.name}`;
  item.addEventListener('click',()=>loadMood(m.v,m.name));mn.appendChild(item);
});

function cosSim(a,b){let dot=0,na=0,nb=0;for(let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);}

function renderSongs(){
  const scored=songs.map(s=>({...s,score:cosSim(vals,s.v)})).sort((a,b)=>b.score-a.score).slice(0,5);
  document.getElementById('songList').innerHTML=scored.map((s,i)=>`
    <div class="song-row">
      <span class="song-idx">${i+1}</span>
      <div class="song-art" style="background:${s.color}"></div>
      <div class="song-info"><div class="song-title">${s.title}</div><div class="song-artist">${s.artist}</div></div>
      <span class="song-pct">${Math.round(s.score*100)}%</span>
    </div>`).join('');
}

(function(){
  const svg=document.getElementById('radar');
  let dragging=-1;
  function getVal(e,i){
    const r=svg.getBoundingClientRect(),scale=200/r.width;
    const mx=((e.clientX||e.touches[0].clientX)-r.left)*scale-cx;
    const my=((e.clientY||e.touches[0].clientY)-r.top)*scale-cy;
    return Math.min(1,Math.max(0,(mx*Math.cos(angles[i])+my*Math.sin(angles[i]))/maxR));
  }
  function onMove(e){
    if(dragging<0)return;e.preventDefault();
    vals[dragging]=getVal(e,dragging);
    document.getElementById('sl'+dragging).value=Math.round(vals[dragging]*100);
    document.getElementById('sv'+dragging).textContent=vals[dragging].toFixed(2);
    draw();renderSongs();
    document.querySelectorAll('.preset-chip,.mood-nav-item').forEach(b=>b.classList.remove('active'));
  }
  [0,1,2,3,4,5].forEach(i=>{
    const d=document.getElementById('d'+i);
    d.addEventListener('mousedown',e=>{dragging=i;e.preventDefault();});
    d.addEventListener('touchstart',e=>{dragging=i;e.preventDefault();},{passive:false});
  });
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',()=>dragging=-1);
  window.addEventListener('touchend',()=>dragging=-1);
})();

const dfx=['','Exact match.','Slight nudge — 1 axis ±0.05.','2 axes nudged, +10% radius.','Wide open.'];
document.getElementById('ds').addEventListener('input',e=>{
  const v=parseInt(e.target.value);
  document.getElementById('dv').textContent=v+'%';
  document.getElementById('dfx').textContent=dfx[Math.min(Math.floor(v/25),3)]||'';
});

// Pane resize
(function(){
  const panes=[
    document.getElementById('pane0'),
    document.getElementById('pane1'),
    document.getElementById('pane2'),
  ];
  const handles=[
    document.getElementById('handle0'),
    document.getElementById('handle1'),
  ];

  const container=document.querySelector('.panes');
  function setWidths(w0,w1,w2){
    panes[0].style.width=w0+'px';panes[0].style.flexShrink='0';
    panes[1].style.width=w1+'px';panes[1].style.flexShrink='0';
    panes[2].style.width=w2+'px';panes[2].style.flexShrink='0';
  }
  function initWidths(){
    const total=container.clientWidth-16;
    setWidths(Math.round(total*0.34),Math.round(total*0.38),Math.round(total*0.28));
  }
  initWidths();
  window.addEventListener('resize',initWidths);

  let active=-1,startX=0,startW0=0,startW1=0;
  handles.forEach((h,hi)=>{
    h.addEventListener('mousedown',e=>{
      active=hi;startX=e.clientX;
      startW0=panes[hi].offsetWidth;startW1=panes[hi+1].offsetWidth;
      h.classList.add('dragging');
      document.body.style.cursor='col-resize';
      document.body.style.userSelect='none';
      e.preventDefault();
    });
  });
  window.addEventListener('mousemove',e=>{
    if(active<0)return;
    const dx=e.clientX-startX;
    const newLeft=Math.max(140,startW0+dx);
    const newRight=Math.max(140,startW1-dx);
    if(newLeft+newRight===startW0+startW1){
      panes[active].style.width=newLeft+'px';
      panes[active+1].style.width=newRight+'px';
    }
  });
  window.addEventListener('mouseup',()=>{
    if(active<0)return;
    handles[active].classList.remove('dragging');
    document.body.style.cursor='';document.body.style.userSelect='';
    active=-1;
  });
})();

draw();
renderSongs();
</script>
